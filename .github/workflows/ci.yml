name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      # Nenhum serviço (PostgreSQL/SMTP) é declarado: os testes rodam só com fakes em memória.
      - run: mvn -B test
